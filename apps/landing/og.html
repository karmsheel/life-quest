<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeQuest — social card</title>
    <style>
      @font-face {
        font-family: "Instrument Serif";
        src: url("./fonts/instrument-serif-latin.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("./fonts/instrument-serif-italic-latin.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url("./fonts/instrument-sans-latin.woff2") format("woff2");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("./fonts/jetbrains-mono-latin.woff2") format("woff2");
        font-weight: 300 600;
      }

      :root {
        --ink: #0a0920;
        --text: #e8e6fb;
        --muted: #9a97c9;
        --aqua: #4adefc;
        --peri: #6e69f4;
        --violet: #a264fa;
        --lilac: #d19dfc;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(60% 70% at 82% 18%, rgba(110, 105, 244, 0.34), transparent 70%),
          radial-gradient(40% 50% at 8% 88%, rgba(162, 100, 250, 0.18), transparent 70%),
          radial-gradient(30% 36% at 68% 92%, rgba(74, 222, 252, 0.12), transparent 70%),
          var(--ink);
        color: var(--text);
        font-family: "Instrument Sans", system-ui, sans-serif;
      }
      .card {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 58px 64px 48px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(143, 134, 255, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(143, 134, 255, 0.055) 1px, transparent 1px);
        background-size: 80px 80px;
        -webkit-mask-image: radial-gradient(ellipse 75% 75% at 70% 40%, #000 10%, transparent 75%);
        mask-image: radial-gradient(ellipse 75% 75% at 70% 40%, #000 10%, transparent 75%);
      }
      .top {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand img {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        filter: drop-shadow(0 0 20px rgba(74, 222, 252, 0.35));
      }
      .brand span {
        font-weight: 650;
        font-size: 25px;
        letter-spacing: -0.015em;
      }
      .brand b {
        color: #8f86ff;
        font-weight: 650;
      }
      .tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .middle {
        position: relative;
        max-width: 760px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--aqua);
        margin-bottom: 22px;
      }
      .eyebrow::before {
        content: "";
        width: 36px;
        height: 1px;
        background: linear-gradient(90deg, var(--aqua), var(--peri));
      }
      h1 {
        margin: 0;
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: 116px;
        line-height: 0.88;
        letter-spacing: -0.035em;
      }
      h1 em {
        font-style: italic;
        background: linear-gradient(102deg, #8cebfb, #8f86ff 46%, #c99bff 78%, #d19dfc);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .bottom {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 40px;
      }
      .bottom p {
        max-width: 520px;
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.55;
      }
      .bottom small {
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8785b8;
        white-space: nowrap;
      }
      .arc {
        position: absolute;
        right: -150px;
        top: 50%;
        width: 660px;
        height: 660px;
        margin-top: -330px;
        border: 1px solid rgba(143, 134, 255, 0.2);
        border-radius: 50%;
      }
      .arc::before {
        content: "";
        position: absolute;
        inset: 96px;
        border: 1px dashed rgba(143, 134, 255, 0.2);
        border-radius: 50%;
      }
      .arc::after {
        content: "";
        position: absolute;
        inset: 210px;
        border: 1px solid rgba(74, 222, 252, 0.14);
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="arc"></div>
      <header class="top">
        <div class="brand">
          <img src="./brand/lq-mark-128.png" alt="" />
          <span>Life<b>Quest</b></span>
        </div>
        <span class="tag">The private agentic harness</span>
      </header>

      <div class="middle">
        <p class="eyebrow">The life operating system</p>
        <h1>Own the <em>axis</em><br />of your life.</h1>
      </div>

      <footer class="bottom">
        <p>
          A local-first studio for one life. Agents around your life, context you
          control, and a vault that stays yours.
        </p>
        <small>Windows beta · No account · No hosted copy</small>
      </footer>
    </div>
  </body>
</html>
