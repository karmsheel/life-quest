<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; media-src 'none';"
    />
    <title>LifeQuest</title>
    <link rel="stylesheet" href="./splash.css" />
    <script src="./theme-boot.js"></script>
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <!--
        The active LifeQuest lockup. The four shipped variants are injected here
        at build time by the `lifequest-splash-logo` plugin in vite.config.ts —
        the same SVG files the sidebar draws, so the splash cannot drift from the
        rail. `theme-boot.js` reads the stored pick and sets `data-logo` on the
        document; the matching variant is the one the splash shows.
      -->
      <!-- splash-logo -->
      <div class="splash__bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
