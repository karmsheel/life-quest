<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>LifeQuest update badge harness</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>
    <script>
      /*
       * Seeds the Developer preview switch before the app module reads it — and
       * through the same key the switch itself writes, so this rig exercises the
       * preference rather than a parallel one. It has to happen here because a
       * page has no origin to write storage to before it has loaded once.
       *
       * `?preview=1` turns it on, `?preview=0` off, absent leaves it alone.
       */
      (() => {
        try {
          const asked = new URLSearchParams(location.search).get("preview");
          if (asked === "1") localStorage.setItem("lifequest-update-preview", "1");
          else if (asked === "0") localStorage.removeItem("lifequest-update-preview");
        } catch {
          /* storage unavailable: the switch simply stays off */
        }
      })();

      /*
       * Captures what a rig can never read out of a `console` it does not own: the
       * harness's own module-load and render failures. A React tree that throws
       * unmounts to an empty `#root`, which otherwise reports as "no rail" and
       * says nothing about why.
       */
      window.__harnessErrors = [];
      window.addEventListener("error", (event) => {
        window.__harnessErrors.push(
          event.error && event.error.stack
            ? String(event.error.stack)
            : `${event.message} @ ${event.filename}:${event.lineno}`,
        );
      });
      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        window.__harnessErrors.push(
          reason && reason.stack ? String(reason.stack) : String(reason),
        );
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./update-badge.tsx"></script>
  </body>
</html>
