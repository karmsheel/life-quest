<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>LifeQuest theme quick menu harness</title>
    <style>
      /* Rig chrome only. Everything in the titlebar and its menu is the app's
         own CSS, loaded by the harness module. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      .rig-page {
        padding: 1.5rem;
        color: var(--text);
      }

      .rig-page h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }

      .rig-page p {
        margin: 0 0 1rem;
        max-width: 34rem;
        color: var(--text-muted);
        font-size: 0.875rem;
        line-height: 1.5;
      }

      /* A page control for the click-away half of the menu's contract: a real
         press outside both the control and the menu must dismiss it. */
      .rig-outside {
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--bg-subtle);
        color: var(--text);
        font: inherit;
        font-size: 0.8125rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./theme-quick-menu.tsx"></script>
  </body>
</html>
